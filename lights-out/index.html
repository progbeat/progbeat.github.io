<html lang="en">

  <style>
:root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background: #000; color: #f4f4f4; }
* { box-sizing: border-box; }

body { -webkit-font-smoothing: antialiased; }
.app { width: min(1180px, 100%); margin: 0 auto; padding: 76px 48px 40px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: 'game table' 'chart chart' 'storage storage'; row-gap: 35px; column-gap: 54px; align-items: start; }
.stage { grid-area: game; text-align: center; outline: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; padding: 0 0 50px; }
.lights { display: flex; justify-content: center; gap: 22px; margin: 0 auto 36px; width: max-content; }
.light { display: block; width: clamp(38px, 5vw, 58px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(ellipse at 40% 26%, #3b3b3b, #303030 70%); }

#result-value { font-size: clamp(52px, 5vw, 72px); font-weight: 400; line-height: 1.13; letter-spacing: -2.5px; font-variant-numeric: tabular-nums; }

#window-size::-webkit-inner-spin-button, #window-size::-webkit-outer-spin-button { appearance: none; margin: 0; }

  .light { width: clamp(38px, 12vw, 58px); }
  #result-value { font-size: clamp(54px, 15vw, 68px); letter-spacing: -2.8px; }

}

@media(prefers-reduced-motion:reduce) { * { scroll-behavior: auto !important; } }

<body>
  <main class="app" data-desktop-layout="b">
    <section class="stage" tabindex="0" aria-label="Reaction test. Press a key, mouse button, or touch to start.">
      <div class="lights" role="img" aria-label="All five lights off"><i class="light"></i><i class="light"></i><i class="light"></i><i class="light"></i><i class="light"></i></div>
      <div class="result-area"><div id="result-value">—<span> ms</span></div><p id="start-hint">Open in a browser to play — this preview may not run JavaScript.</p></div>
    </section>
    <section class="chart-area" data-control aria-label="Reaction graph and history browsing">
      <div class="history-navigation"><span id="window-label">0 rounds</span><label class="window-size-label">view <input id="window-size" type="number" inputmode="numeric" min="1" value="50" aria-label="Number of visible attempts"></label></div>
      <div id="chart" tabindex="0" role="group" aria-label="Reaction history. Drag to browse, arrow keys to move, plus or minus to zoom."></div>
      <div class="overview"><div id="overview-graph" aria-hidden="true"></div><input id="history-position" type="range" min="0" max="0" value="0" aria-label="Browse earlier or later history"></div>
    </section>
    <section class="table-area" data-control aria-label="Attempt history">
      <div class="table-scroll" tabindex="0"><table><thead><tr><th scope="col">#</th><th scope="col">ms</th><th scope="col">ao5</th><th scope="col">ao12</th><th scope="col">Input</th></tr></thead><tbody id="history-rows"></tbody></table></div>
    </section>
    <p id="storage-note" role="status" hidden></p>
    <p id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  </main>
  <script>
const MEAN_DELAY_MS = 500;
const LIGHT_INTERVAL_MS = 600;

// 53 random bits, uniformly mapped to [0, 1). Never returns 1.
function uniform53(cryptoSource = globalThis.crypto) {
  const words = new Uint32Array(2);
  cryptoSource.getRandomValues(words);
  return ((words[0] >>> 5) * 67108864 + (words[1] >>> 6)) / 9007199254740992;
}

function exponentialDelay(u) {
  if (!Number.isFinite(u) || u < 0 || u >= 1) throw new RangeError('U must be in [0, 1).');
  return -MEAN_DELAY_MS * Math.log(1 - u);
}

// Modern events are relative to performance.timeOrigin; older epoch stamps
// are converted to that same origin. No empirical latency offset is applied.
function normalizeEventTime(timestamp, handledAt, timeOrigin) {
  if (!Number.isFinite(timestamp) || timestamp <= 0) return null;
  const epochRelative = timestamp - timeOrigin;
  return Math.abs(epochRelative - handledAt) < Math.abs(timestamp - handledAt)
    ? epochRelative : timestamp;
}

function summarize(records) {
  const successful = records.filter(record => !record.falseStart).map(record => record.reactionMs).sort((a, b) => a - b);
  const middle = Math.floor(successful.length / 2);
  return {
    count: records.length,
    meanScore: records.length ? records.reduce((sum, record) => sum + record.scoreMs, 0) / records.length : null,
    falseStarts: records.filter(record => record.falseStart).length,
    medianReaction: successful.length ? (successful.length % 2 ? successful[middle] : (successful[middle - 1] + successful[middle]) / 2) : null,
    bestReaction: successful.length ? successful[0] : null,
  };
}

class ReactionEngine {
  constructor({ now, setTimer, clearTimer, requestFrame, cancelFrame, random = uniform53, invalidReason = () => null, onChange, onSignal, onResult }) {
    Object.assign(this, { now, setTimer, clearTimer, requestFrame, cancelFrame, random, invalidReason, onChange, onSignal, onResult });
    this.state = 'idle';
    this.lights = 0;
    this.generation = 0;
    this.timer = this.frame = null;
    this.held = new Map();
    this.releaseIds = new Set();
    this.roundInputs = new Set();
    this.attempt = null;
    this.previousFrameMs = null;
    this.frameIntervals = [];
    this.maxFrameGapMs = 0;
    this.trialFrameIntervals = [];
    this.lastTrialFrame = null;
  }

  get active() { return ['countdown', 'waiting', 'signal'].includes(this.state); }
  get scoring() { return ['waiting', 'signal'].includes(this.state); }

  observeFrame(frameTime) {
    if (!this.active) return;
    if (this.lastTrialFrame !== null) this.trialFrameIntervals.push(frameTime - this.lastTrialFrame);
    this.lastTrialFrame = frameTime;
  }

  guardTiming() {
    const reason = this.invalidReason();
    if (!reason) return true;
    this.cancel(reason);
    return false;
  }

  stopScheduled() {
    this.generation += 1;
    if (this.timer !== null) this.clearTimer(this.timer);
    if (this.frame !== null) this.cancelFrame(this.frame);
    this.timer = this.frame = null;
  }

  // Every physical edge is tracked. Down starts the red preparation sequence.
  // Each round owns its downs. Old held inputs can never leak releases into it.
  input(edge, event) {
    const wasHeld = this.held.has(event.inputId);
    if (edge === 'down') {
      if (wasHeld) return;
      this.held.set(event.inputId, event.device);
      if (!this.active) {
        this.stopScheduled();
        this.beginCountdown(event);
        return;
      }
    } else {
      if (!wasHeld) return;
      this.held.delete(event.inputId);
    }
    if (!this.active) { this.onChange(this); return; }
    if (event.eventTimeMs !== null && event.eventTimeMs < this.attempt.startedAtMs) return;
    if (edge === 'down') this.roundInputs.add(event.inputId);
    if (edge === 'up' && !this.roundInputs.has(event.inputId)) return;
    if (!this.guardTiming()) return;
    if (this.state === 'countdown') {
      this.onChange(this);
      return;
    }
    // A queued preparation edge must not become a false start merely because
    // its handler runs after the fifth light. Use the event's actual timestamp.
    if (this.scoring && event.eventTimeMs !== null && event.eventTimeMs < this.attempt.allLightsOnMs) {
      if (edge === 'up') this.releaseIds.delete(event.inputId);
      else this.releaseIds.add(event.inputId);
      this.onChange(this);
      return;
    }
    if (!this.scoring || (edge === 'up' && !this.releaseIds.has(event.inputId))) return;
    if (event.eventTimeMs === null || !Number.isFinite(event.eventTimeMs)) {
      this.cancel('Event timestamp unavailable');
      return;
    }
    const onset = this.attempt.softwareOnsetMs;
    const falseStart = onset === null || event.eventTimeMs < onset;
    const reactionMs = falseStart ? null : event.eventTimeMs - onset;
    const intervals = this.frameIntervals.slice().sort((a, b) => a - b);
    const medianFrameIntervalMs = intervals.length ? intervals[Math.floor(intervals.length / 2)] : null;
    const trialIntervals = this.trialFrameIntervals.slice().sort((a, b) => a - b);
    const trialMedian = trialIntervals.length ? trialIntervals[Math.floor(trialIntervals.length / 2)] : null;
    const trialMax = trialIntervals.length ? trialIntervals[trialIntervals.length - 1] : null;
    const record = {
      ...this.attempt, ...event,
      trialMedianFrameIntervalMs: trialMedian, maxTrialFrameGapMs: trialMax,
      trialFrameIntervalsMs: this.trialFrameIntervals.slice(),
      frameQuality: trialMedian === null ? 'Not recorded' : trialMax > trialMedian * 1.8 ? 'Uneven cadence' : 'Stable cadence',
      physicalCalibration: false,
      modeKey: `${event.device}:${edge}`,
      responseEdge: edge,
      falseStart, reactionMs,
      scoreMs: falseStart ? 500 : reactionMs,
      recentFrameIntervalsMs: this.frameIntervals.slice(),
      medianFrameIntervalMs,
      maxFrameGapMs: this.maxFrameGapMs,
      suspectedMissedFrames: medianFrameIntervalMs ? this.frameIntervals.reduce((sum, gap) => sum + Math.max(0, Math.round(gap / medianFrameIntervalMs) - 1), 0) : null,
    };
    this.stopScheduled();
    this.state = 'result';
    this.lights = 0;
    this.onResult(record);
    this.onChange(this);
  }

  beginCountdown(event) {
    this.trialFrameIntervals = [];
    this.lastTrialFrame = null;
    this.releaseIds.clear();
    this.roundInputs = new Set([event.inputId]);
    this.attempt = {
      startedAtMs: Number.isFinite(event.eventTimeMs) ? event.eventTimeMs : this.now(), startedHandlerAtMs: this.now(), preparedInput: null,
      allLightsOnMs: null, sampledDelayMs: null,
      scheduledOffMs: null, softwareOnsetMs: null,
    };
    this.state = 'countdown';
    this.lights = 0;
    this.frameIntervals = [];
    this.maxFrameGapMs = 0;
    this.onChange(this);
    if (!this.guardTiming()) return;
    this.nextLight(this.generation);
  }

  nextLight(generation) {
    this.frame = this.requestFrame(frameTime => {
      this.frame = null;
      if (generation !== this.generation || this.state !== 'countdown') return;
      if (!this.guardTiming()) return;
      this.lights += 1;
      if (this.lights < 5) {
        this.onChange(this);
        this.timer = this.setTimer(() => this.nextLight(generation), LIGHT_INTERVAL_MS);
      } else {
        this.releaseIds = new Set([...this.held.keys()].filter(id => this.roundInputs.has(id)));
        this.attempt.preparedInput = this.releaseIds.size ? this.held.get([...this.releaseIds][0]) : null;
        this.state = 'waiting';
        this.onChange(this);
        this.attempt.allLightsOnMs = this.now();
        this.attempt.sampledDelayMs = exponentialDelay(this.random());
        this.attempt.scheduledOffMs = this.attempt.allLightsOnMs + this.attempt.sampledDelayMs;
        this.previousFrameMs = frameTime;
        this.frameIntervals = [];
        this.maxFrameGapMs = 0;
        this.pollSignalFrame(generation);
      }
    });
  }

  pollSignalFrame(generation) {
    // Tiny frame loop while all five lights are on. It also measures software
    // frame gaps; these diagnostics are never subtracted from the score.
    this.frame = this.requestFrame(frameTime => {
      this.frame = null;
      if (generation !== this.generation || this.state !== 'waiting') return;
      if (!this.guardTiming()) return;
      if (this.previousFrameMs !== null) {
        const gap = frameTime - this.previousFrameMs;
        this.maxFrameGapMs = Math.max(this.maxFrameGapMs, gap);
        this.frameIntervals.push(gap);
        if (this.frameIntervals.length > 180) this.frameIntervals.shift();
      }
      this.previousFrameMs = frameTime;
      if (this.now() < this.attempt.scheduledOffMs) {
        this.pollSignalFrame(generation);
        return;
      }
      this.lights = 0;
      this.state = 'signal';
      this.onSignal(); // only five existing light-class mutations
      this.attempt.softwareOnsetMs = this.now(); // adjacent marker in this rAF
      this.attempt.onsetFrameTimestampMs = frameTime;
      this.onChange(this); // adapter records state; no competing visible cue
    });
  }

  cancel(reason = 'Attempt cancelled') {
    if (!this.active) return;
    this.stopScheduled();
    this.state = 'cancelled';
    this.lights = 0;
    this.attempt = null;
    this.cancelReason = reason;
    this.onChange(this);
  }

  clearHeld() { this.held.clear(); this.roundInputs.clear(); this.releaseIds.clear(); }
}

// Each aoN drops exactly one fastest and one slowest score. Penalties remain
// numeric 500 ms scores; slow successful reactions are never clipped.
function rollingAverage(records, endIndex, size) {
  if (!Number.isInteger(size) || size < 3) throw new RangeError('Average size must be at least three');
  if (endIndex < size - 1 || endIndex >= records.length) return null;
  const scores = records.slice(endIndex - size + 1, endIndex + 1).map(record => record.scoreMs);
  if (scores.some(score => !Number.isFinite(score) || score < 0)) return null;
  scores.sort((a, b) => a - b);
  return scores.slice(1, -1).reduce((sum, score) => sum + score, 0) / (size - 2);
}

function historyWindow(length, requestedCount = 50, requestedEnd = length) {
  const count = Math.max(1, Math.min(Number.MAX_SAFE_INTEGER, Math.round(Number(requestedCount)) || 50));
  const end = Math.max(0, Math.min(length, Math.round(Number(requestedEnd)) || 0));
  return { count, end, start: Math.max(0, end - count) };
}

function tableRows(records, viewport) {
  return records.slice(viewport.start, viewport.end).map((record, offset) => {
    const index = viewport.start + offset;
    return { record, round: index + 1, ao5: rollingAverage(records, index, 5), ao12: rollingAverage(records, index, 12) };
  });
}

// One trusted stream per device. Mouse chords produce pointermove events.
function bindInputs({ engine, surface, eventData, onStart = () => {} }) {
  const controls = 'button, a, input, select, textarea, summary, [contenteditable]:not([contenteditable="false"]), [data-control]';
  const isControl = event => event.composedPath().some(node => node instanceof Element && node.matches(controls));
  const reserved = event => (event.shiftKey && /^(Space|Arrow.*|Home|End|PageUp|PageDown|Enter)$/.test(event.code)) || event.ctrlKey || event.metaKey || event.altKey || event.isComposing || /^(Tab|Escape|Shift|Control|Alt|Meta|CapsLock|NumLock|ScrollLock|ContextMenu|PrintScreen|Pause|Dead|Unidentified|F\d{1,2}|Audio.*|Media.*|Browser.*)$/.test(event.key);
  const contacts = new Set();
  const send = (edge, event, device, inputId, handledAt) => {
    if (edge === 'down' && !engine.active && !engine.held.has(inputId)) onStart();
    engine.input(edge, eventData(event, handledAt, device, inputId));
  };
  const cancel = reason => { engine.cancel(reason); engine.clearHeld(); contacts.clear(); };
  document.addEventListener('keydown', event => {
    const handledAt = performance.now();
    if (!event.isTrusted) return;
    if (event.key === 'Escape') {
      if (engine.active && !isControl(event)) event.preventDefault();
      engine.cancel('Attempt cancelled'); return;
    }
    if (reserved(event)) {
      if (engine.active && (event.ctrlKey || event.metaKey || event.altKey)) cancel('Browser shortcut');
      return;
    }
    if (isControl(event)) return;
    event.preventDefault();
    surface.classList.remove('pointer-focused');
    if (!event.repeat) send('down', event, 'keyboard', `key:${event.code || event.key}`, handledAt);
  });
  document.addEventListener('keyup', event => {
    const handledAt = performance.now();
    if (!event.isTrusted) return;
    const id = `key:${event.code || event.key}`;
    if (!engine.held.has(id)) return;
    if (reserved(event) || isControl(event)) { cancel('Focus moved to a control'); return; }
    event.preventDefault(); send('up', event, 'keyboard', id, handledAt);
  });
  function capture(event) {
    surface.classList.add('pointer-focused');
    surface.focus({ preventScroll: true });
    if (event.type === 'pointerdown') {
      try { surface.setPointerCapture(event.pointerId); } catch { /* inactive pointer */ }
    }
  }
  function pointer(event) {
    const handledAt = performance.now();
    if (!event.isTrusted) return;
    if (event.pointerType === 'mouse') {
      // button is the transition; buttons is the resulting held mask. In a
      // chord, intermediate presses/releases are pointermove events. Never
      // infer new presses from an old held mask after blur/cancellation.
      const bit = { 0: 1, 2: 2, 1: 4 }[event.button];
      if (!bit) return; // ordinary movement has button === -1
      const id = `mouse:${event.button}`, down = Boolean(event.buttons & bit);
      if (down && (isControl(event) || event.ctrlKey || event.metaKey || event.altKey || event.shiftKey)) return;
      if (!down && !engine.held.has(id)) return;
      event.preventDefault();
      if (down) capture(event);
      send(down ? 'down' : 'up', event, 'mouse', id, handledAt);
      return;
    }
    if (!['touch', 'pen'].includes(event.pointerType)) return;
    const id = `pointer:${event.pointerId}`;
    if (event.type === 'pointerdown') {
      contacts.add(event.pointerId);
      if (contacts.size > 1 || !event.isPrimary) { cancel('Multiple contacts'); return; }
      if (isControl(event)) return;
      event.preventDefault(); capture(event);
      send('down', event, event.pointerType, id, handledAt);
    } else if (event.type === 'pointerup') {
      contacts.delete(event.pointerId);
      if (!engine.held.has(id)) return;
      event.preventDefault(); send('up', event, event.pointerType, id, handledAt);
    }
  }
  if (globalThis.PointerEvent) {
    for (const type of ['pointerdown', 'pointermove', 'pointerup']) document.addEventListener(type, pointer, { passive: false });
  } else {
    // Legacy WebKit has Touch Events but no Pointer Events. Preventing the
    // accepted touchstart default suppresses its compatibility mouse stream.
    for (const type of ['touchstart', 'touchend', 'touchcancel']) document.addEventListener(type, event => {
      const handledAt = performance.now();
      if (!event.isTrusted) return;
      if (type === 'touchcancel') { cancel('Touch cancelled'); return; }
      if (event.touches.length > 1) { cancel('Multiple contacts'); return; }
      if (type === 'touchstart' && isControl(event)) return;
      event.preventDefault();
      for (const touch of event.changedTouches) {
        const id = `touch:${touch.identifier}`;
        if (type === 'touchstart') { surface.focus({ preventScroll: true }); send('down', event, 'touch', id, handledAt); }
        else if (engine.held.has(id)) send('up', event, 'touch', id, handledAt);
      }
    }, { passive: false });
    for (const type of ['mousedown', 'mouseup']) document.addEventListener(type, event => {
      const handledAt = performance.now();
      if (!event.isTrusted || event.sourceCapabilities?.firesTouchEvents || ![0, 1, 2].includes(event.button)) return;
